<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScamShield — Web Scanner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🛡️ScamShield </h1>
      <p class="subtitle">Fake & Suspicious Website Detector (basic)</p>
    </header>

    <main>
      <div class="input-section">
        <label for="url-input">Enter website URL or domain:</label>
        <div class="input-group">
          <input 
            type="text" 
            id="url-input" 
            placeholder="e.g. flipkart-sale.xyz or https://meesho-offer.shop" 
            autocomplete="off"
          />
          <button id="scan-btn">Scan Website</button>
        </div>
        
        <div class="quick-examples">
          <span>Try:</span>
          <button class="chip" data-url="flipkart.com">flipkart.com</button>
          <button class="chip" data-url="flipkart-super-sale.xyz">flipkart-super-sale.xyz</button>
          <button class="chip" data-url="meesho-offer.shop">meesho-offer.shop</button>
        </div>
      </div>

      <div id="result-card" class="result-card hidden">
        <div class="domain-header">
          <span class="label">Analyzed Domain:</span>
          <h2 id="domain-display">-</h2>
        </div>

        <div id="risk-badge" class="risk-badge">
          <span id="risk-level">-</span>
        </div>

        <div class="score-container">
          <span class="score-label">Risk Score:</span>
          <span id="risk-score" class="score-value">0</span><span class="score-max">/100</span>
        </div>

        <div class="reasons-box">
          <h3>Detected Signals:</h3>
          <ul id="reasons-list"></ul>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
